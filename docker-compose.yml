name: mpay

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMPOSER_REPO: ${COMPOSER_REPO:-}
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${MPAY_IMAGE:-mpay-local:latest}
    container_name: mpay-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_DEBUG: ${APP_DEBUG:-false}
      EPAY_PLATFORM_KEY_DIR: /data/config
      MPAY_CONFIG_DIR: /data/config
      ALIPAY_BILL_WATCHER_POLL_INTERVAL_SECONDS: ${ALIPAY_BILL_WATCHER_POLL_INTERVAL_SECONDS:-0.5}
    ports:
      # Secure default: expose only to the host. Reverse proxy 127.0.0.1:8787 with Nginx/OpenResty/1Panel.
      - "127.0.0.1:${MPAY_PORT:-8787}:8787"
    volumes:
      - ./data/config:/data/config
      - ./data/runtime:/app/runtime
      - ./data/public-storage:/app/public/storage
    networks:
      - mpay

  mysql:
    image: mysql:8.0
    container_name: mpay-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mpay}
      MYSQL_USER: ${MYSQL_USER:-mpay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - mpay
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mpay-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ./data/redis:/data
    networks:
      - mpay
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  mpay:
    name: mpay-network
